<p style="margin:0 0 16px;">{{ _("Hello") }}{% if customer_name %}, <strong>{{ customer_name }}</strong>{% endif %}.</p>
<p style="margin:0 0 20px;">{{ _("We got your payment. Thanks.") }}</p>

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 20px;background:#f8fafc;border-radius:8px;">
  <tr>
    <td style="padding:14px 18px;">
      <p style="margin:0 0 4px;font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;">{{ _("Loan") }}</p>
      <p style="margin:0 0 12px;font-size:16px;font-weight:700;color:#0f172a;">{{ loan_name }}</p>
      <p style="margin:0 0 4px;font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;">{{ _("Paid") }}</p>
      <p style="margin:0;font-size:20px;font-weight:700;color:{{ primary_color }};">{{ amount_paid }}</p>
    </td>
  </tr>
</table>

<table role="presentation" width="100%" cellspacing="0" cellpadding="0">
  <tr>
    <td align="center" style="padding:8px 0;">
      <a href="{{ site_url | safe }}/lms/loan?name={{ loan_name | urlencode }}" style="display:inline-block;padding:14px 32px;background:{{ primary_color }};color:#ffffff;font-weight:600;font-size:15px;border-radius:8px;text-decoration:none;">{{ _("View loan") }}</a>
    </td>
  </tr>
</table>
